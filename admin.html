<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>

<style>
body {
    font-family: Arial;
    background: #f5f7fb;
    padding: 20px;
}

h2 {
    margin-bottom: 20px;
}

.card {
    background: #fff;
    padding: 15px;
    margin-bottom: 10px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.btn {
    padding: 6px 12px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    margin-right: 5px;
}

.approve {
    background: #22c55e;
    color: white;
}

.reject {
    background: #ef4444;
    color: white;
}

.pending {
    color: orange;
}
</style>
</head>

<body>

<h2>Withdraw Requests</h2>

<div id="withdrawList"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

<script>
// 🔥 তোমার Firebase config এখানে বসাও
const firebaseConfig = {
 apiKey: "AIzaSyBO-1q2JTgj5w49ExP1qJWKw2Kgl-ncxNk",
  authDomain: "mail-fact.firebaseapp.com",
  databaseURL: "https://mail-fact-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "mail-fact",
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

// 🔄 Load Withdraw Requests
function loadRequests() {
    db.ref("withdraw_requests").on("value", snapshot => {
        const data = snapshot.val();
        const container = document.getElementById("withdrawList");
        container.innerHTML = "";

        for (let id in data) {
            const item = data[id];

            const div = document.createElement("div");
            div.className = "card";

            div.innerHTML = `
                <b>User:</b> ${item.userId}<br>
                <b>Amount:</b> $${item.amount}<br>
                <b>Status:</b> <span class="${item.status}">${item.status}</span><br><br>

                ${item.status === "pending" ? `
                    <button class="btn approve" onclick="approve('${id}','${item.userId}',${item.amount})">Approve</button>
                    <button class="btn reject" onclick="reject('${id}')">Reject</button>
                ` : ""}
            `;

            container.appendChild(div);
        }
    });
}


// ✅ Approve Withdraw
function approve(id, userId, amount) {
    const ref = db.ref();

    // 1. status update
    ref.child("withdraw_requests/" + id).update({
        status: "approved"
    });

    // 2. balance update (auto)
    ref.child("users/" + userId + "/balance").transaction(balance => {
        return (balance || 0) - amount;
    });

    alert("Approved & Balance Updated!");
}


// ❌ Reject Withdraw
function reject(id) {
    db.ref("withdraw_requests/" + id).update({
        status: "rejected"
    });

    alert("Request Rejected!");
}


// 🚀 Run
loadRequests();

</script>

</body>
</html>
