<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body { background:#f3f4f6; }
.card { border-radius:15px; }
.btn { border-radius:10px; }
</style>

</head>
<body>

<div class="container py-4">
  <h2 class="mb-4 text-center">🔥 Admin Panel</h2>

  <!-- LOGIN -->
  <div id="loginBox" class="card p-3">
    <h5>Admin Login</h5>
    <input type="email" id="email" class="form-control mb-2" placeholder="Email">
    <input type="password" id="password" class="form-control mb-2" placeholder="Password">
    <button onclick="login()" class="btn btn-primary w-100">Login</button>
  </div>

  <!-- ADMIN PANEL -->
  <div id="adminPanel" style="display:none;">
    <button onclick="logout()" class="btn btn-danger mb-3">Logout</button>
    <div id="list"></div>
  </div>
</div>

<script type="module">

/* ================= FIREBASE ================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, onValue, update, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* ================= CONFIG ================= */
const firebaseConfig = {
  apiKey: "AIzaSyBO-1q2JTgj5w49ExP1qJWKw2Kgl-ncxNk",
  authDomain: "mail-fact.firebaseapp.com",
  databaseURL: "https://mail-fact-default-rtdb.firebaseio.com",
  projectId: "mail-fact",
  storageBucket: "mail-fact.firebasestorage.app",
  messagingSenderId: "800577449702",
  appId: "1:800577449702:web:0576286f40bfac40451527"
};

/* ================= INIT ================= */
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let isProcessing = false;

/* ================= LOGIN ================= */
window.login = async () => {
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('password').value;

  if(!email || !pass){
    alert("Email & Password required!");
    return;
  }

  try {
    const userCred = await signInWithEmailAndPassword(auth, email, pass);
    const user = userCred.user;

    // ✅ Admin check
    const snap = await get(ref(db, "users/" + user.uid));

    if(!snap.exists() || snap.val().isAdmin !== true){
      alert("❌ Not Admin!");
      await signOut(auth);
      return;
    }

    // ✅ UI show
    document.getElementById('loginBox').style.display = "none";
    document.getElementById('adminPanel').style.display = "block";

    loadData();

  } catch(e){
    console.error(e);
    alert("Login Error: " + e.message);
  }
};

/* ================= LOGOUT ================= */
window.logout = async () => {
  await signOut(auth);
  location.reload();
};

/* ================= AUTO LOGIN ================= */
onAuthStateChanged(auth, async (user) => {
  if(user){
    const snap = await get(ref(db, "users/" + user.uid));

    if(snap.exists() && snap.val().isAdmin === true){
      document.getElementById('loginBox').style.display = "none";
      document.getElementById('adminPanel').style.display = "block";
      loadData();
    }
  }
});

/* ================= LOAD DATA ================= */
function loadData(){
  onValue(ref(db, "submissions"), (snap) => {

    const list = document.getElementById('list');
    list.innerHTML = "";

    if(!snap.exists()){
      list.innerHTML = "<p class='text-center'>No submissions</p>";
      return;
    }

    snap.forEach(child => {

      const d = child.val();
      const key = child.key;

      list.innerHTML += `
      <div class="card p-3 mb-3 shadow-sm">
        <div><b>User:</b> ${d.username || "N/A"}</div>
        <div><b>Total:</b> ${d.totalAmount || 0}</div>
        <div><b>Status:</b> ${d.status || "pending"}</div>

        <hr>

        <button 
          class="btn btn-success btn-sm me-2"
          onclick="approve('${key}','${d.userId}',${d.totalAmount || 0})">
          Approve
        </button>

        <button 
          class="btn btn-danger btn-sm"
          onclick="reject('${key}','${d.userId}',${d.totalAmount || 0})">
          Reject
        </button>
      </div>
      `;
    });

  });
}

/* ================= APPROVE ================= */
window.approve = async (id, uid, amount) => {

  if(isProcessing) return;
  isProcessing = true;

  try{
    const userRef = ref(db, "users/" + uid);
    const snap = await get(userRef);

    let balance = snap.val().balance || 0;
    let hold = snap.val().hold || 0;

    await update(ref(db, "submissions/" + id), {
      status: "approved"
    });

    await update(userRef, {
      balance: balance + amount,
      hold: Math.max(0, hold - amount)
    });

    alert("Approved");

  }catch(e){
    console.error(e);
    alert("Approve Error");
  }

  isProcessing = false;
};

/* ================= REJECT ================= */
window.reject = async (id, uid, amount) => {

  if(isProcessing) return;
  isProcessing = true;

  try{
    const userRef = ref(db, "users/" + uid);
    const snap = await get(userRef);

    let hold = snap.val().hold || 0;

    await update(ref(db, "submissions/" + id), {
      status: "rejected"
    });

    await update(userRef, {
      hold: Math.max(0, hold - amount)
    });

    alert("Rejected");

  }catch(e){
    console.error(e);
    alert("Reject Error");
  }

  isProcessing = false;
};

</script>

</body>
</html>
