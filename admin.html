<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel</title>
  <script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {

apiKey: "AIzaSyBO-1q2JTgj5w49ExP1qJWKw2Kgl-ncxNk",
  authDomain: "mail-fact.firebaseapp.com",
  databaseURL: "https://mail-fact-default-rtdb.firebaseio.com",
 
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

onAuthStateChanged(auth, (user) => {
  if (!user) return alert("Login required");

  onValue(ref(db, "users/" + user.uid), (snap) => {
    if (!snap.val().isAdmin) {
      alert("Not Admin");
      location.href = "/";
    }
  });
});

// Load submissions
onValue(ref(db, "submissions"), (snap) => {
  const box = document.getElementById("submissions");
  box.innerHTML = "";

  snap.forEach((child) => {
    const data = child.val();

    box.innerHTML += `
      <div style="border:1px solid #ccc; padding:10px; margin:10px">
        <b>User:</b> ${data.username}<br>
        <b>Amount:</b> ${data.totalAmount}<br>
        <b>Status:</b> ${data.status}<br>
        <button onclick="approve('${child.key}')">Approve</button>
        <button onclick="reject('${child.key}')">Reject</button>
      </div>
    `;
  });
});

window.approve = (id) => {
  update(ref(db, "submissions/" + id), {
    status: "approved"
  });
};

window.reject = (id) => {
  update(ref(db, "submissions/" + id), {
    status: "rejected"
  });
};

// Withdraw Requests
onValue(ref(db, "withdraw_requests"), (snap) => {
  const box = document.getElementById("withdraws");
  box.innerHTML = "";

  snap.forEach((child) => {
    const data = child.val();

    box.innerHTML += `
      <div style="border:1px solid red; padding:10px; margin:10px">
        <b>${data.username}</b><br>
        ${data.amount} BDT<br>
        <button onclick="approveW('${child.key}', '${data.userId}', ${data.amount})">Approve</button>
      </div>
    `;
  });
});

window.approveW = (id, uid, amount) => {
  const updates = {};

  updates["withdraw_requests/" + id + "/status"] = "approved";
  updates["users/" + uid + "/balance"] = 0; // modify logic

  update(ref(db), updates);
};

  </script>
</head>

<body>
  <h2>Admin Panel</h2>

  <h3>Submissions</h3>
  <div id="submissions"></div>

  <h3>Withdraw Requests</h3>
  <div id="withdraws"></div>
</body>
</html>
