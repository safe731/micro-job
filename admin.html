<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="p-3 bg-light">

<h3 class="mb-3">🔐 Admin Panel</h3>

<!-- LOGIN -->
<div id="loginBox" class="card p-3 mb-3">
  <input type="email" id="email" class="form-control mb-2" placeholder="Admin Email">
  <input type="password" id="pass" class="form-control mb-2" placeholder="Password">
  <button onclick="login()" class="btn btn-primary w-100">Login</button>
</div>

<!-- DASHBOARD -->
<div id="adminPanel" style="display:none;">
  <button onclick="logout()" class="btn btn-danger mb-3">Logout</button>
  <div id="submissionList"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, onValue, update, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* 🔥 তোমার Firebase config বসাও */
const firebaseConfig = {
  apiKey: "AIzaSyBO-1q2JTgj5w49ExP1qJWKw2Kgl-ncxNk",
  authDomain: "mail-fact.firebaseapp.com",
  databaseURL: "https://mail-fact-default-rtdb.firebaseio.com",
  projectId: "mail-fact"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const list = document.getElementById("submissionList");

/* 🔐 LOGIN */
window.login = async () => {
  const email = document.getElementById("email").value;
  const pass = document.getElementById("pass").value;

  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch (e) {
    alert("Login failed ❌");
  }
};

/* 🔓 LOGOUT */
window.logout = () => {
  signOut(auth);
};

/* 🔍 ADMIN CHECK */
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    document.getElementById("loginBox").style.display = "block";
    document.getElementById("adminPanel").style.display = "none";
    return;
  }

  const snap = await get(ref(db, 'admins/' + user.uid));

  if (!snap.exists()) {
    alert("Not admin ❌");
    signOut(auth);
    return;
  }

  // ✅ Admin OK
  document.getElementById("loginBox").style.display = "none";
  document.getElementById("adminPanel").style.display = "block";

  loadSubmissions();
});

/* 📊 LOAD DATA */
function loadSubmissions() {
  onValue(ref(db, "submissions"), (snap) => {
    list.innerHTML = "";

    snap.forEach(child => {
      const data = child.val();
      const id = child.key;

      list.innerHTML += `
        <div class="card p-2 mb-2">
          <b>${data.username}</b><br>
          💰 ${data.totalAmount} ৳<br>
          📌 ${data.status}<br><br>

          <button onclick="approve('${id}','${data.userId}',${data.totalAmount})" class="btn btn-success btn-sm">Approve</button>
          <button onclick="reject('${id}','${data.userId}',${data.totalAmount})" class="btn btn-danger btn-sm">Reject</button>
        </div>
      `;
    });
  });
}

/* ✅ APPROVE */
window.approve = async (id, userId, amount) => {
  const userRef = ref(db, 'users/' + userId);
  const snap = await get(userRef);
  const user = snap.val();

  await update(userRef, {
    balance: (user.balance || 0) + amount,
    hold: (user.hold || 0) - amount
  });

  await update(ref(db, 'submissions/' + id), {
    status: "approved"
  });

  alert("Approved ✅");
};

/* ❌ REJECT */
window.reject = async (id, userId, amount) => {
  const userRef = ref(db, 'users/' + userId);
  const snap = await get(userRef);
  const user = snap.val();

  await update(userRef, {
    hold: (user.hold || 0) - amount
  });

  await update(ref(db, 'submissions/' + id), {
    status: "rejected"
  });

  alert("Rejected ❌");
};
</script>

</body>
</html>
