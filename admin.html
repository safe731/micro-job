




<div id="admin-login">
  <h2>Admin Login</h2>
  <input type="email" id="email" placeholder="Email"><br><br>
  <input type="password" id="password" placeholder="Password"><br><br>
  <button onclick="adminLogin()">Login</button>
</div>

<div id="admin-dashboard" style="display:none;">
  <h2>Admin Dashboard</h2>
  <p>Welcome Admin</p>

  <div id="withdrawList"></div>
</div>



<script>
function adminLogin() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    firebase.auth().signInWithEmailAndPassword(email, password)
    .then((userCred) => {
        const uid = userCred.user.uid;

        // 🔍 Check admin
        firebase.database().ref("users/" + uid).once("value")
        .then(snapshot => {
            const data = snapshot.val();

            if (data && data.isAdmin === true) {
                document.getElementById("admin-login").style.display = "none";
                document.getElementById("admin-dashboard").style.display = "block";

                loadWithdrawRequests();
            } else {
                alert("Access Denied! Not Admin");
            }
        });
    })
    .catch(err => {
        alert("Login Failed: " + err.message);
    });
}
function loadWithdrawRequests() {
    firebase.database().ref("withdraw_requests").on("value", snapshot => {
        const data = snapshot.val();
        const container = document.getElementById("withdrawList");
        container.innerHTML = "";

        for (let id in data) {
            const item = data[id];

            const div = document.createElement("div");
            div.innerHTML = `
                <p>User: ${item.userId}</p>
                <p>Amount: ${item.amount}</p>
                <p>Status: ${item.status}</p>

                ${item.status === "pending" ? `
                    <button onclick="approve('${id}','${item.userId}',${item.amount})">Approve</button>
                    <button onclick="reject('${id}')">Reject</button>
                ` : ""}
                <hr>
            `;

            container.appendChild(div);
        }
    });
}
function approve(id, userId, amount) {
    const db = firebase.database();

    // status update
    db.ref("withdraw_requests/" + id).update({
        status: "approved"
    });

    // balance deduct
    db.ref("users/" + userId + "/balance").transaction(balance => {
        return (balance || 0) - amount;
    });

    alert("Approved!");
}

function reject(id) {
    firebase.database().ref("withdraw_requests/" + id).update({
        status: "rejected"
    });

    alert("Rejected!");
}









</script>
