<style>
body {
  font-family: Arial;
  background: #f4f6f9;
  padding: 20px;
}

h2, h3 {
  color: #333;
}

input {
  padding: 10px;
  width: 250px;
}

button {
  padding: 8px 12px;
  border: none;
  background: #4F46E5;
  color: white;
  cursor: pointer;
  margin: 5px;
}

.card {
  background: white;
  padding: 15px;
  margin: 10px 0;
  border-radius: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}



</style>

<div id="admin-login">
  <h2>Admin Login</h2>
  <input type="email" id="email" placeholder="Email"><br><br>
  <input type="password" id="password" placeholder="Password"><br><br>
  <button onclick="adminLogin()">Login</button>
</div>

<div id="admin-dashboard" style="display:none;">
  <h2>Admin Dashboard</h2>

  <h3>📥 Submissions</h3>
  <div id="submissionList"></div>

  <h3>💸 Withdraw Requests</h3>
  <div id="withdrawList"></div>
</div>




<script>
function adminLogin() {
  const email = email.value;
  const password = password.value;

  firebase.auth().signInWithEmailAndPassword(email, password)
  .then(userCred => {
    const uid = userCred.user.uid;

    firebase.database().ref("users/" + uid).once("value")
    .then(snap => {
      const data = snap.val();

      if (data && data.isAdmin === true) {
        document.getElementById("admin-login").style.display = "none";
        document.getElementById("admin-dashboard").style.display = "block";

        loadSubmissions();
        loadWithdraws();
      } else {
        alert("Not Admin!");
      }
    });
  });
}


function loadSubmissions() {
  firebase.database().ref("submissions").on("value", snap => {
    const data = snap.val();
    const container = document.getElementById("submissionList");
    container.innerHTML = "";

    for (let id in data) {
      const item = data[id];

      const div = document.createElement("div");
      div.className = "card";

      div.innerHTML = `
        <p>User: ${item.username}</p>
        <p>Amount: ${item.totalAmount}</p>
        <p>Status: ${item.status}</p>

        ${item.status === "pending" ? `
          <button onclick="approveSubmission('${id}','${item.userId}',${item.totalAmount})">Approve</button>
          <button onclick="rejectSubmission('${id}')">Reject</button>
        ` : ""}
      `;

      container.appendChild(div);
    }
  });
}


function approveSubmission(id, userId, amount) {
  const db = firebase.database();

  // status update
  db.ref("submissions/" + id).update({
    status: "approved"
  });

  // 🔥 HOLD → BALANCE TRANSFER
  db.ref("users/" + userId).transaction(user => {
    if (user) {
      user.hold = (user.hold || 0) - amount;
      user.balance = (user.balance || 0) + amount;
    }
    return user;
  });

  alert("Submission Approved ✅");
}

function rejectSubmission(id) {
  firebase.database().ref("submissions/" + id).update({
    status: "rejected"
  });

  alert("Rejected ❌");
}

function loadWithdraws() {
  firebase.database().ref("withdraw_requests").on("value", snap => {
    const data = snap.val();
    const container = document.getElementById("withdrawList");
    container.innerHTML = "";

    for (let id in data) {
      const item = data[id];

      const div = document.createElement("div");
      div.className = "card";

      div.innerHTML = `
        <p>User: ${item.username}</p>
        <p>Amount: ${item.amount}</p>
        <p>Status: ${item.status}</p>

        ${item.status === "pending" ? `
          <button onclick="approveWithdraw('${id}')">Approve</button>
          <button onclick="rejectWithdraw('${id}','${item.userId}',${item.amount})">Reject</button>
        ` : ""}
      `;

      container.appendChild(div);
    }
  });function approveWithdraw(id) {
  firebase.database().ref("withdraw_requests/" + id).update({
    status: "approved"
  });

  alert("Withdraw Approved 💸");
}
}

function rejectWithdraw(id, userId, amount) {
  const db = firebase.database();

  db.ref("withdraw_requests/" + id).update({
    status: "rejected"
  });

  // টাকা ফেরত
  db.ref("users/" + userId).transaction(user => {
    if (user) {
      user.balance = (user.balance || 0) + amount;
    }
    return user;
  });

  alert("Withdraw Rejected & টাকা ফেরত ✅");
}
